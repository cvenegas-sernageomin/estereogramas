<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Estereogramas · Análisis Estructural</title>

  <!-- ░░ PWA (instalable en Android / iOS cuando se sirve por https) ░░ -->
  <meta name="theme-color" content="#13293D" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Estereogramas" />
  <!-- Favicon: la misma red de Schmidt de los iconos, simplificada para 16 px -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2313293D'/><circle cx='8' cy='8' r='6.4' fill='%23F5F8FB' stroke='%23384E66' stroke-width='0.8'/><path d='M8 1.6 A4.2 6.4 0 0 1 8 14.4' fill='none' stroke='%239CAEC1' stroke-width='0.6'/><path d='M1.6 8 H14.4' stroke='%239CAEC1' stroke-width='0.6'/><path d='M8 1.9 A4 6.1 0 0 1 8 14.1' fill='none' stroke='%231F6FB2' stroke-width='1.5' transform='rotate(18 8 8)'/><circle cx='5.4' cy='6.4' r='1.15' fill='%23B23A3A'/></svg>" />

  <!-- ░░ Leaflet (mapa de ubicación de grupos) ░░ -->
  <style>/*__LEAFLETCSS__*/</style>

  <style>
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    }
    html, body { margin: 0; padding: 0; }
    body { overscroll-behavior-y: none; }
    #root { min-height: 100vh; min-height: 100dvh; }
    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
    }
    [style*="overflow"] { -webkit-overflow-scrolling: touch; }
    @media (max-width: 760px) {
      input, select, textarea { font-size: 16px !important; }
    }
    /* Impresión / "Guardar como PDF": se imprime el análisis, no la interfaz
       de edición. Los estereogramas son SVG, así que salen vectoriales. */
    .solo-imprimir { display: none; }
    @media print {
      @page { margin: 12mm; }
      body { background: #fff; }
      .no-imprimir { display: none !important; }
      .solo-imprimir { display: block !important; }
      /* Cada grupo entero en una página, sin cortarlo por la mitad */
      .panel-grupo { break-inside: avoid; page-break-inside: avoid; }
      /* Sin sombras ni fondos que gasten tinta */
      .panel-grupo, .bloque-analisis {
        border: 1px solid #999 !important;
        outline: none !important;
        box-shadow: none !important;
      }
    }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 14px;
      background: #13293D; color: #EAF2FA;
      font-family: system-ui, sans-serif; z-index: 9999;
    }
    /* El CSS de Leaflet pide images/layers.png por ruta relativa; en un HTML
       autocontenido esa carpeta no existe y daba un 404. */
    .leaflet-control-layers-toggle { background-image: none !important; }
    .leaflet-control-layers { font-size: 12px; }
    #boot .t { font-size: 20px; font-weight: 700; }
    #boot .s { font-size: 12px; font-family: monospace; letter-spacing: .08em; opacity: .7; }
  </style>
</head>
<body>
  <div id="boot">
    <div class="t">Estereogramas</div>
    <div class="s">cargando…</div>
  </div>
  <div id="root"></div>

  <!-- ░░ Librerías embebidas (funciona sin internet) ░░ -->
  <script>/*__REACT__*/</script>
  <script>/*__REACTDOM__*/</script>
  <script>/*__BABEL__*/</script>
  <script>/*__LEAFLETJS__*/</script>
  <script>/*__PROJ4__*/</script>

  <!-- ░░ Aplicación ░░ -->
  <script type="text/babel" data-presets="react">
/*__APP__*/
  </script>

  <script type="text/babel" data-presets="react">
    requestAnimationFrame(() => {
      const b = document.getElementById("boot");
      if (b) b.remove();
    });
  </script>

  <!-- ░░ Registro del service worker (PWA) — solo con https o localhost ░░ -->
  <script>
    if ("serviceWorker" in navigator &&
        (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
